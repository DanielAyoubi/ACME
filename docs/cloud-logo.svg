<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140">
  <title>ACME - Automated Control and Monitoring of Experiments</title>
  <style>
    .name { fill: #1f2937; }
    .tagline { fill: #4b5563; }
    .initial { fill: #2b6cb0; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #f3f4f6; }
      .tagline { fill: #d1d5db; }
      .initial { fill: #63b3ed; }
    }
  </style>
  <defs>
    <linearGradient id="cloud" x1="0" y1="20" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#90cdf4"/>
      <stop offset="1" stop-color="#3182ce"/>
    </linearGradient>
  </defs>

  <!-- cloud -->
  <g fill="url(#cloud)">
    <circle cx="42" cy="62" r="22"/>
    <circle cx="70" cy="46" r="28"/>
    <circle cx="98" cy="60" r="22"/>
    <rect x="20" y="58" width="100" height="26" rx="13"/>
  </g>

  <!-- droplets of different sizes -->
  <g fill="#3182ce">
    <path d="M44 96 C49 103 51 107 51 110 A7 7 0 0 1 37 110 C37 107 39 103 44 96 Z"/>
    <path d="M70 100 C76 108 78 113 78 117 A8 8 0 0 1 62 117 C62 113 64 108 70 100 Z"/>
    <path d="M96 98 C100 103 101 106 101 108 A5 5 0 0 1 91 108 C91 106 92 103 96 98 Z"/>
  </g>

  <text x="148" y="82" class="name" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="6">ACME</text>
  <text x="150" y="112" class="tagline" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15"><tspan class="initial">A</tspan>utomated <tspan class="initial">C</tspan>ontrol and <tspan class="initial">M</tspan>onitoring of <tspan class="initial">E</tspan>xperiments</text>
</svg>
